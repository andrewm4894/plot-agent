[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plot-agent"
version = "0.4.0"
authors = [
    { name="andrewm4894", email="andrewm4894@gmail.com" },
]
description = "An AI-powered data visualization assistant using Plotly"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "plotly",
    "langchain-core",
    "langchain",
    "langchain-openai",
    "langgraph",
    "pydantic",
    "python-dotenv",
    "ipykernel>=6.30.1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/andrewm4894/plot-agent"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "papermill",
    "build",
    "twine",
]
posthog = [
    "posthog",
] 
