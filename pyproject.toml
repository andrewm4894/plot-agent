[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plot-agent"
version = "0.5.1"
authors = [
    { name="andrewm4894", email="andrewm4894@gmail.com" },
]
description = "An AI-powered data visualization assistant using Plotly"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "plotly",
    "kaleido",
    "langchain-core",
    "langchain-openai",
    "langgraph",
    "pydantic",
    "python-dotenv",
]

[project.optional-dependencies]
posthog = ["posthog"]

[project.urls]
"Homepage" = "https://github.com/andrewm4894/plot-agent" 